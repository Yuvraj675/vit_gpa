<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIT CGPA Calculator</title>

    
    <style>
      .text-wrap-balance { text-wrap: balance; }
      #sync-badge { display: none; }
      body.has-cloud #sync-badge { display: inline-flex; }
      @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.4 } }
      .syncing .sync-dot { animation: pulse 1s infinite; }
    </style>

    <!-- Supabase JS SDK (cross-device sync) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- User config: copy .env.example to .env.js and fill in your Supabase credentials -->
    <script src=".env.js"></script>
    <meta name="google-site-verification" content="XetV9wM6WqN7V6OwfP6Xti3Fw0IRB-7B5J0Jx6IBMOo" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: "class" }
    </script>
</head>

<body>
<div class="min-h-screen bg-gray-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-sans antialiased" id="app-wrapper">

    <button id="theme-toggle" class="theme-toggle fixed top-4 right-4 z-50 w-11 h-11 rounded-full border border-zinc-300 dark:border-zinc-700 bg-white/90 dark:bg-zinc-900/90 backdrop-blur grid place-items-center text-xl shadow-sm hover:-translate-y-0.5 transition" title="Toggle theme">🌙</button>
    <div id="sync-badge" class="offline fixed top-4 right-20 z-50 hidden items-center gap-2 rounded-full border border-zinc-300 dark:border-zinc-700 bg-white/90 dark:bg-zinc-900/90 backdrop-blur px-3 py-1.5 text-sm" title="Cloud sync status">
        <span class="sync-dot w-2 h-2 rounded-full bg-zinc-400"></span><span>Offline</span>
    </div>
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
        <header class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-6 mb-10">
            <div>
                <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold tracking-tight text-wrap-balance">VIT CGPA Calculator</h1>
                <p class="sub text-zinc-600 dark:text-zinc-400 mt-2 text-sm sm:text-base">Select credits and grades for each subject. Calculator updates instantly.</p>
            </div>
            <div class="text-right">
                <div class="text-xs uppercase tracking-wide text-zinc-500">Total Credits</div>
                <div class="text-2xl font-semibold"><span class="total-credits">0</span></div>
            </div>
        </header>
        <p class="sub shortcut-hint text-sm text-zinc-500 dark:text-zinc-400 mt-2">Shortcuts: <kbd class="px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 font-mono text-xs">Ctrl/Cmd</kbd>+<kbd class="px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 font-mono text-xs">Enter</kbd> Calculate &nbsp;·&nbsp; <kbd class="px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 font-mono text-xs">Ctrl/Cmd</kbd>+<kbd class="px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 font-mono text-xs">Shift</kbd>+<kbd class="px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 font-mono text-xs">C</kbd> Clear</p>
    <div id="input-container" class="grid gap-3 my-8">
        <div class="input-pair grid grid-cols-1 sm:grid-cols-[1fr_140px_140px] gap-3 items-center p-3 px-4 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 shadow-sm focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/30">
            <input type="text" placeholder="Subject Name" class="subject-name w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <select class="credits w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="0">Credits</option>
                <option value="1">1</option>
                <option value="1.5">1.5</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="20">20</option>
            </select>
            <select class="grades w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="-1">Grade</option>
                <option value="10">S</option>
                <option value="9">A</option>
                <option value="8">B</option>
                <option value="7">C</option>
                <option value="6">D</option>
                <option value="5">E</option>
                <option value="0">F</option>
            </select>
        </div>
    </div>
    <div class="previous grid sm:grid-cols-2 gap-6 my-6">
        <div class="ctner">
            <label for="prev" class="block text-xs uppercase tracking-wide text-zinc-500 mb-1">Current CGPA</label>
            <input type="text" name="prev" id="prev" autocomplete="off" class="w-full rounded-xl border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="ctner">
            <label for="prev_creds" class="block text-xs uppercase tracking-wide text-zinc-500 mb-1">Completed Credits</label>
            <input type="text" name="prev_creds" id="prev_creds" autocomplete="off" class="w-full rounded-xl border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
    </div>
    <div class="btn-container flex flex-wrap gap-3 items-center mt-8">
            <button id="calculate-btn" class="px-6 py-3 rounded-full bg-blue-600 hover:bg-blue-700 text-white font-semibold shadow-sm min-h-[44px]">Calculate GPA</button>
            <button id="clear-btn" class="px-5 py-3 rounded-full bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 border border-zinc-200 dark:border-zinc-700 min-h-[44px]">Clear All</button>
            <div class="flex flex-wrap gap-2 ml-auto">
                <button id="export-btn" class="px-4 py-2.5 rounded-full border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 hover:bg-zinc-50 dark:hover:bg-zinc-800 min-h-[44px]">Export</button>
                <button id="import-btn" class="px-4 py-2.5 rounded-full border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 hover:bg-zinc-50 dark:hover:bg-zinc-800 min-h-[44px]">Import</button>
                <button id="sync-btn" title="Sync with cloud" class="px-4 py-2.5 rounded-full border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 hover:bg-zinc-50 dark:hover:bg-zinc-800 min-h-[44px]">☁️ Sync</button>
                <button id="add-subject-btn" class="px-4 py-2.5 rounded-full border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 hover:bg-zinc-50 dark:hover:bg-zinc-800 min-h-[44px]">Add Subject</button>
                <button id="all-s-btn" class="px-4 py-2.5 rounded-full border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 hover:bg-zinc-50 dark:hover:bg-zinc-800 min-h-[44px]">All S</button>
                <button id="clear-grades-btn" class="px-4 py-2.5 rounded-full border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-zinc-900 hover:bg-zinc-50 dark:hover:bg-zinc-800 min-h-[44px]">Clear Grades</button>
            </div>
            <div class="flex flex-wrap gap-3 mt-4 pt-6 border-t border-zinc-200 dark:border-zinc-800">
                        <p id="result-gpa" class="hidden px-5 py-3 rounded-full font-semibold text-white"></p>
                        <p id="result-cgpa" class="hidden px-5 py-3 rounded-full font-semibold text-white"></p>
                    </div>
                    <div id="result-progress-container" class="hidden mt-4 rounded-2xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 p-5 shadow-sm">
                        <div id="progress-bar" class="h-3 w-full rounded-full bg-zinc-100 dark:bg-zinc-800 overflow-hidden">
                            <div id="progress-fill" class="h-full w-0 rounded-full transition-all duration-500"></div>
                        </div>
                        <div id="result-details" class="flex flex-wrap gap-2 mt-3 text-sm">
                            <span id="detail-weighted-sum" class="px-3 py-1 rounded-full bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700"></span>
                            <span id="detail-total-credits" class="px-3 py-1 rounded-full bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700"></span>
                            <button id="copy-btn" class="ml-auto px-3 py-1 rounded-full border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-50 dark:hover:bg-zinc-800 text-sm">Copy</button>
                        </div>
                    </div>
        </div>
        <input type="file" id="import-file" accept=".json" class="hidden">
    </div>

    <script>
        const inputContainer = document.getElementById('input-container');
        const calculateBtn = document.getElementById('calculate-btn');
        const result_gpa = document.getElementById('result-gpa');
        const result_cgpa = document.getElementById('result-cgpa');

        function createInputPair() {
            const inputPair = document.createElement('div');
            inputPair.className = 'input-pair grid grid-cols-1 sm:grid-cols-[1fr_140px_140px] gap-3 items-center p-3 px-4 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 shadow-sm focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/30';

            const subjectName = document.createElement('input');
            subjectName.type = 'text';
            subjectName.placeholder = 'Subject Name';
            subjectName.className = 'subject-name w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500'

            const creditsSelect = document.createElement('select');
            creditsSelect.className = 'credits w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500';
            creditsSelect.innerHTML = `
                <option value="0">Credits</option>
                <option value="1">1</option>
                <option value="1.5">1.5</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="20">20</option>
            `;

            const gradesSelect = document.createElement('select');
            gradesSelect.className = 'grades w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500';
            gradesSelect.innerHTML = `
                <option value="-1">Grade</option>
                <option value="10">S</option>
                <option value="9">A</option>
                <option value="8">B</option>
                <option value="7">C</option>
                <option value="6">D</option>
                <option value="5">E</option>
                <option value="0">F</option>
            `;

            inputPair.appendChild(subjectName);
            inputPair.appendChild(creditsSelect);
            inputPair.appendChild(gradesSelect);
            inputContainer.appendChild(inputPair);

            creditsSelect.addEventListener('change', checkForNewPair);
            gradesSelect.addEventListener('change', checkForNewPair);
        }

        function checkForNewPair() {
            const pairs = document.querySelectorAll('.input-pair');
            const lastPair = pairs[pairs.length - 1];
            const credits = lastPair.querySelector('.credits').value;
            const grades = lastPair.querySelector('.grades').value;
            const totalCredits = Array.from(pairs).reduce((sum, pair) => {
                return sum + parseFloat(pair.querySelector('.credits').value) || 0;
            }, 0);
            document.querySelector('.total-credits').textContent = totalCredits;
            if (credits !== "0" && pairs.length < 20) {
                createInputPair();
            }
        }

        function updateTotalCredits() {
            const pairs = document.querySelectorAll('.input-pair');
            const totalCredits = Array.from(pairs).reduce((sum, pair) => {
                return sum + parseFloat(pair.querySelector('.credits').value) || 0;
            }, 0);
            document.querySelector('.total-credits').textContent = totalCredits;
        }

        function calculateGPA() {
            const pairs = document.querySelectorAll('.input-pair');
            let totalCredits = 0;
            let weightedSum = 0;

            pairs.forEach(pair => {
                const credits = parseFloat(pair.querySelector('.credits').value);
                const grade = parseInt(pair.querySelector('.grades').value);

                if (credits > 0 && grade >= 0) {
                    totalCredits += credits;
                    weightedSum += credits * grade;
                }
            });

            return totalCredits > 0 ? (weightedSum / totalCredits).toFixed(2) : 0;
        }

        // calculateBtn.addEventListener('click', calculateGPA);

        // Initialize with 5 pairs
        for (let i = 0; i < 4; i++) {
            createInputPair();
        }

        function saveChoices() {
            const pairs = document.querySelectorAll('.input-pair');
            const data = Array.from(pairs).map(pair => {
            return {
                name: pair.querySelector('.subject-name').value,
                credits: pair.querySelector('.credits').value,
                grades: pair.querySelector('.grades').value,
                prevCGPA: document.getElementById('prev').value,
                prevCredits: document.getElementById('prev_creds').value
            };
            });
            localStorage.setItem('gpaChoices', JSON.stringify(data));
            localStorage.setItem('gpaUpdated', Date.now().toString());
            scheduleSync();
        }

        function loadChoices() {
            const savedData = JSON.parse(localStorage.getItem('gpaChoices'));
            if (!savedData) return; // No saved data, exit function
            inputContainer.innerHTML = ''; // Clear existing pairs
            savedData.forEach(item => {
                const inputPair = document.createElement('div');
                inputPair.className = 'input-pair grid grid-cols-1 sm:grid-cols-[1fr_140px_140px] gap-3 items-center p-3 px-4 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 shadow-sm focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/30';
                const subjectName = document.createElement('input');
                subjectName.type='text'
                subjectName.placeholder='Subject Name'
                subjectName.className = 'subject-name w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500'
                subjectName.value=item.name || '';
                const creditsSelect = document.createElement('select');
                creditsSelect.className = 'credits w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500';
                creditsSelect.innerHTML = `
                <option value="0">Credits</option>
                <option value="1">1</option>
                <option value="1.5">1.5</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="20">20</option>
                `;
                creditsSelect.value = item.credits;

                const gradesSelect = document.createElement('select');
                gradesSelect.className = 'grades w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500';
                gradesSelect.innerHTML = `
                <option value="-1">Grade</option>
                <option value="10">S</option>
                <option value="9">A</option>
                <option value="8">B</option>
                <option value="7">C</option>
                <option value="6">D</option>
                <option value="5">E</option>
                <option value="0">F</option>
                `;
                gradesSelect.value = item.grades;

                inputPair.appendChild(subjectName);
                inputPair.appendChild(creditsSelect);
                inputPair.appendChild(gradesSelect);
                inputContainer.appendChild(inputPair);

                document.getElementById('prev').value = item.prevCGPA || 0;
                document.getElementById('prev_creds').value = item.prevCredits || 0;

                creditsSelect.addEventListener('change', checkForNewPair);
                gradesSelect.addEventListener('change', checkForNewPair);
            });
            updateTotalCredits();
        }

        window.addEventListener('load', loadChoices);

        function calculateOverallCGPA() {
            const prevCGPA = parseFloat(document.getElementById('prev').value) || 0;
            const prevCredits = parseFloat(document.getElementById('prev_creds').value) || 0;

            const pairs = document.querySelectorAll('.input-pair');
            let totalCredits = prevCredits;
            let weightedSum = prevCGPA * prevCredits;

            pairs.forEach(pair => {
                const credits = parseFloat(pair.querySelector('.credits').value);
                const grade = parseInt(pair.querySelector('.grades').value);

                if (credits > 0 && grade >= 0) {
                    totalCredits += credits;
                    weightedSum += credits * grade;
                }
            });

            const overallCGPA = totalCredits > 0 ? (weightedSum / totalCredits).toFixed(2) : 0;
            return overallCGPA;
        }

        function displayResults() {
            const gpa = calculateGPA();
            const overallCGPA = calculateOverallCGPA();

            result_gpa.classList.remove('hidden');
            result_gpa.style.backgroundColor = gpa >= 9 ? 'green' : gpa >= 8 ? 'orange' : gpa >= 6 ? 'crimson' : 'darkred';
            result_gpa.innerHTML = `Your GPA is: ${gpa}`;

            result_cgpa.classList.remove('hidden');
            result_cgpa.style.backgroundColor = overallCGPA >= 9 ? 'green' : overallCGPA >= 8 ? 'orange' : overallCGPA >= 6 ? 'crimson' : 'darkred';
            result_cgpa.innerHTML = `Your Overall CGPA is: ${overallCGPA}`;

            // Progress bar: full green at 10, orange ~7, red below 7
            const progressFill = document.getElementById('progress-fill');
            const pct = Math.min(gpa, 10) * 10;
            progressFill.style.width = pct + '%';
            progressFill.style.backgroundColor = gpa >= 8 ? '#28a745' : gpa >= 6 ? '#fd7e14' : '#dc3545';

            // Weighted sum + total credits
            const pairs = document.querySelectorAll('.input-pair');
            let weightedSum = 0, totalCredits = 0;
            pairs.forEach(pair => {
                const credits = parseFloat(pair.querySelector('.credits').value);
                const grade = parseInt(pair.querySelector('.grades').value);
                if (credits > 0 && grade >= 0) {
                    totalCredits += credits;
                    weightedSum += credits * grade;
                }
            });
            document.getElementById('detail-weighted-sum').textContent = `Weighted sum: ${weightedSum.toFixed(2)}`;
            document.getElementById('detail-total-credits').textContent = `Total credits: ${totalCredits}`;

            const progressContainer = document.getElementById('result-progress-container');
            progressContainer.classList.remove('hidden');

            result_gpa.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // Copy button
        const copyBtn = document.getElementById('copy-btn');
        copyBtn.addEventListener('click', function() {
            const gpa = calculateGPA();
            const cgpa = calculateOverallCGPA();
            const text = `GPA: ${gpa} | CGPA: ${cgpa}`;
            navigator.clipboard.writeText(text).then(() => {
                const original = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                setTimeout(() => {
                    copyBtn.textContent = original;
                    copyBtn.classList.remove('copied');
                }, 1500);
            });
        });

        // Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        const bodyEl = document.body;
        const appWrapper = document.getElementById('app-wrapper');
        function applyTheme(theme) {
            if (theme === 'light') {
                bodyEl.classList.add('light');
                appWrapper?.classList.remove('dark');
                themeToggle.textContent = '☀️';
            } else {
                bodyEl.classList.remove('light');
                appWrapper?.classList.add('dark');
                themeToggle.textContent = '🌙';
            }
        }
        const savedTheme = localStorage.getItem('theme');
        applyTheme(savedTheme === 'light' ? 'light' : 'dark');
        themeToggle.addEventListener('click', function() {
            const isLight = bodyEl.classList.toggle('light');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            applyTheme(isLight ? 'light' : 'dark');
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            const mod = e.ctrlKey || e.metaKey;
            if (!mod) return;
            if (e.key === 'Enter') {
                e.preventDefault();
                calculateBtn.click();
            } else if (e.key === 'c' || e.key === 'C') {
                if (e.shiftKey) {
                    e.preventDefault();
                    clearBtn.click();
                }
            }
        });

        calculateBtn.addEventListener('click', function() {
            saveChoices();
            displayResults();
        });

        // Numeric input validation for CGPA and Completed Credits fields
        const prevField = document.getElementById('prev');
        const prevCredsField = document.getElementById('prev_creds');
        prevField.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9.]/g, '');
            updateTotalCredits();
            saveChoices();
            scheduleSync();
        });
        prevCredsField.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9.]/g, '');
            updateTotalCredits();
            saveChoices();
            scheduleSync();
        });

        // Clear All button: reset form and clear localStorage
        const clearBtn = document.getElementById('clear-btn');
        clearBtn.addEventListener('click', function() {
            localStorage.removeItem('gpaChoices');
            inputContainer.innerHTML = '';
            // Recreate the initial single input pair
            const inputPair = document.createElement('div');
            inputPair.className = 'input-pair grid grid-cols-1 sm:grid-cols-[1fr_140px_140px] gap-3 items-center p-3 px-4 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 shadow-sm focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/30';
            const subjectName = document.createElement('input');
            subjectName.type = 'text';
            subjectName.placeholder = 'Subject Name';
            subjectName.className = 'subject-name w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500';
            const creditsSelect = document.createElement('select');
            creditsSelect.className = 'credits w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500';
            creditsSelect.innerHTML = `
                <option value="0">Credits</option>
                <option value="1">1</option>
                <option value="1.5">1.5</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="20">20</option>
            `;
            const gradesSelect = document.createElement('select');
            gradesSelect.className = 'grades w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500';
            gradesSelect.innerHTML = `
                <option value="-1">Grade</option>
                <option value="10">S</option>
                <option value="9">A</option>
                <option value="8">B</option>
                <option value="7">C</option>
                <option value="6">D</option>
                <option value="5">E</option>
                <option value="0">F</option>
            `;
            inputPair.appendChild(subjectName);
            inputPair.appendChild(creditsSelect);
            inputPair.appendChild(gradesSelect);
            inputContainer.appendChild(inputPair);
            creditsSelect.addEventListener('change', checkForNewPair);
            gradesSelect.addEventListener('change', checkForNewPair);
            // Reset CGPA/credits fields
            prevField.value = '';
            prevCredsField.value = '';
            // Reset results
            result_gpa.classList.add('hidden');
            result_cgpa.classList.add('hidden');
            document.getElementById('result-progress-container').classList.add('hidden');
            updateTotalCredits();
            saveChoices();
            scheduleSync();
        });

        // EXPORT DATA: download current state as JSON
        const exportBtn = document.getElementById('export-btn');
        exportBtn.addEventListener('click', function() {
            const data = JSON.stringify(getCurrentState());
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vit_gpa_state.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        function getCurrentState() {
            const pairs = document.querySelectorAll('.input-pair');
            return Array.from(pairs).map(pair => ({
                name: pair.querySelector('.subject-name').value,
                credits: pair.querySelector('.credits').value,
                grades: pair.querySelector('.grades').value,
                prevCGPA: document.getElementById('prev').value,
                prevCredits: document.getElementById('prev_creds').value
            }));
        }

        // IMPORT DATA: load JSON state from file
        const importBtn = document.getElementById('import-btn');
        const importFile = document.getElementById('import-file');
        importBtn.addEventListener('click', function() {
            importFile.click();
        });
        importFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const data = JSON.parse(ev.target.result);
                    applyState(data);
                    saveChoices();
                    scheduleSync();
                } catch (err) {
                    alert('Invalid JSON file: ' + err.message);
                }
                importFile.value = ''; // reset so same file can be re-imported
            };
            reader.readAsText(file);
        });

        function applyState(data) {
            if (!Array.isArray(data)) {
                alert('Invalid state format: expected an array of subjects.');
                return;
            }
            inputContainer.innerHTML = '';
            data.forEach(item => {
                const inputPair = document.createElement('div');
                inputPair.className = 'input-pair grid grid-cols-1 sm:grid-cols-[1fr_140px_140px] gap-3 items-center p-3 px-4 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-900 shadow-sm focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/30';
                const subjectName = document.createElement('input');
                subjectName.type = 'text';
                subjectName.placeholder = 'Subject Name';
                subjectName.className = 'subject-name w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500';
                subjectName.value = item.name || '';
                const creditsSelect = document.createElement('select');
                creditsSelect.className = 'credits w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500';
                creditsSelect.innerHTML = `
                <option value="0">Credits</option>
                <option value="1">1</option>
                <option value="1.5">1.5</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="20">20</option>
                `;
                creditsSelect.value = item.credits || '0';
                const gradesSelect = document.createElement('select');
                gradesSelect.className = 'grades w-full rounded-lg border border-zinc-300 dark:border-zinc-700 bg-transparent px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500';
                gradesSelect.innerHTML = `
                <option value="-1">Grade</option>
                <option value="10">S</option>
                <option value="9">A</option>
                <option value="8">B</option>
                <option value="7">C</option>
                <option value="6">D</option>
                <option value="5">E</option>
                <option value="0">F</option>
                `;
                gradesSelect.value = item.grades || '-1';
                inputPair.appendChild(subjectName);
                inputPair.appendChild(creditsSelect);
                inputPair.appendChild(gradesSelect);
                inputContainer.appendChild(inputPair);
                creditsSelect.addEventListener('change', checkForNewPair);
                gradesSelect.addEventListener('change', checkForNewPair);
            });
            if (data.length > 0) {
                const last = data[data.length - 1];
                document.getElementById('prev').value = last.prevCGPA || '';
                document.getElementById('prev_creds').value = last.prevCredits || '';
            }
            updateTotalCredits();
            saveChoices();
        }

        // ADD SUBJECT: manually append a new empty row
        const addSubjectBtn = document.getElementById('add-subject-btn');
        addSubjectBtn.addEventListener('click', function() {
            const pairs = document.querySelectorAll('.input-pair');
            if (pairs.length >= 20) {
                alert('Maximum 20 subjects reached.');
                return;
            }
            createInputPair();
            updateTotalCredits();
            saveChoices();
            scheduleSync();
        });

        // QUICK FILL: All S
        const allSBtn = document.getElementById('all-s-btn');
        allSBtn.addEventListener('click', function() {
            document.querySelectorAll('.grades').forEach(sel => {
                sel.value = '10';
            });
            updateTotalCredits();
            saveChoices();
            scheduleSync();
        });

        // QUICK FILL: Clear Grades (reset to placeholder -1)
        const clearGradesBtn = document.getElementById('clear-grades-btn');
        clearGradesBtn.addEventListener('click', function() {
            document.querySelectorAll('.grades').forEach(sel => {
                sel.value = '-1';
            });
            updateTotalCredits();
            saveChoices();
            scheduleSync();
        });

        // ===================== SUPABASE CROSS-DEVICE SYNC =====================
        // Initialize Supabase client from window.SUPABASE_CONFIG (set in .env.js)
        // If no config is present, sync is disabled gracefully and we fall back to localStorage only.
        let _supabaseClient = null;
        let syncUser = null;
        let syncReady = false;
        let syncTimer = null;
        const SYNC_DEBOUNCE_MS = 1000;

        const syncBadge = document.getElementById('sync-badge');

        function setSyncStatus(status) {
            // status: 'synced' | 'syncing' | 'offline' | 'disabled'
            syncBadge.classList.remove('synced', 'syncing', 'offline');
            const dot = syncBadge.querySelector('.sync-dot');
            const label = syncBadge.querySelector('span:last-child');
            if (status === 'synced') {
                syncBadge.classList.add('synced');
                label.textContent = 'Synced';
            } else if (status === 'syncing') {
                syncBadge.classList.add('syncing');
                label.textContent = 'Syncing...';
            } else if (status === 'offline') {
                syncBadge.classList.add('offline');
                label.textContent = 'Offline';
            } else {
                syncBadge.classList.add('offline');
                label.textContent = 'No cloud';
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            if (type === 'error') {
                toast.style.background = 'rgba(220,53,69,0.9)';
            } else if (type === 'success') {
                toast.style.background = 'rgba(40,167,69,0.9)';
            }
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function initSupabase() {
            const cfg = window.SUPABASE_CONFIG;
            if (!cfg || !cfg.url || !cfg.anonKey ||
                cfg.url === 'YOUR_SUPABASE_URL' || cfg.anonKey === 'YOUR_SUPABASE_ANON_KEY') {
                setSyncStatus('disabled');
                document.body.classList.remove('has-cloud');
                return;
            }
            document.body.classList.add('has-cloud');
            try {
                _supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey);
                // Anonymous sign-in so we have a user identity for RLS policies
                _supabaseClient.auth.signInAnonymously().then(({ data, error }) => {
                    if (error) {
                        console.warn('Supabase anon sign-in failed:', error.message);
                        setSyncStatus('offline');
                        showToast('Cloud sync unavailable: ' + error.message, 'error');
                        return;
                    }
                    syncUser = data.user;
                    syncReady = true;
                    setSyncStatus('synced');
                    // Pull any existing cloud data on first load
                    pullFromCloud();
                }).catch((err) => {
                    console.warn('Supabase init error:', err);
                    setSyncStatus('offline');
                });
            } catch (err) {
                console.warn('Supabase client creation failed:', err);
                setSyncStatus('disabled');
            }
        }

        function scheduleSync() {
            if (!syncReady) return;
            clearTimeout(syncTimer);
            syncTimer = setTimeout(pushToCloud, SYNC_DEBOUNCE_MS);
        }

        async function pushToCloud() {
            if (!syncReady || !syncUser) return;
            setSyncStatus('syncing');
            try {
                const state = getCurrentState();
                const { error } = await _supabaseClient
                    .from('user_gpa_data')
                    .upsert({
                        user_id: syncUser.id,
                        data: state,
                        updated_at: new Date().toISOString()
                    }, { onConflict: 'user_id' });
                if (error) throw error;
                setSyncStatus('synced');
            } catch (err) {
                console.error('Sync push failed:', err);
                setSyncStatus('offline');
                showToast('Sync failed: ' + err.message, 'error');
            }
        }

        async function pullFromCloud() {
            if (!syncReady || !syncUser) return;
            try {
                const { data, error } = await _supabaseClient
                    .from('user_gpa_data')
                    .select('data, updated_at')
                    .eq('user_id', syncUser.id)
                    .maybeSingle();
                if (error) throw error;
                if (data && data.data) {
                    const cloudUpdated = new Date(data.updated_at).getTime();
                    const localUpdated = localStorage.getItem('gpaUpdated');
                    // Only apply cloud data if it's newer than local
                    if (!localUpdated || cloudUpdated > parseInt(localUpdated, 10)) {
                        applyState(data.data);
                        saveChoices();
                        setSyncStatus('synced');
                    }
                } else {
                    setSyncStatus('synced');
                }
            } catch (err) {
                console.error('Sync pull failed:', err);
                setSyncStatus('offline');
            }
        }

        // Manual sync button
        const syncBtn = document.getElementById('sync-btn');
        syncBtn.addEventListener('click', async function() {
            if (!syncReady) {
                showToast('Cloud sync not configured. Add your Supabase credentials in .env.js.', 'error');
                return;
            }
            setSyncStatus('syncing');
            await pushToCloud();
            await pullFromCloud();
        });

        // Online/offline detection
        window.addEventListener('online', () => {
            if (syncReady) {
                scheduleSync();
            }
        });
        window.addEventListener('offline', () => {
            setSyncStatus('offline');
        });

        // Initialize on page load
        window.addEventListener('load', () => {
            initSupabase();
        });
    </script>
    <div id="toast-container" aria-live="polite"></div>
</div>
</body>

</html>
